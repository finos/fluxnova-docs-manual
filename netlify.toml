[build]
command = "npm --prefix fluxnova-playground install --package-lock=false --registry=https://registry.npmjs.org/ && npm --prefix fluxnova-playground run build && npm --prefix fluxnova-initializer install --package-lock=false --registry=https://registry.npmjs.org/ && npm --prefix fluxnova-initializer run build && hugo --minify"
publish = "public"
