name: Release and Publish Documentation

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (major.minor, e.g. "3.1"). Only needed for ad-hoc manual runs; pushes to release/vX.Y.Z branches derive it automatically.'
        required: false
        type: string
  push:
    branches:
      - 'release/*'
jobs:
  build-and-publish:
    name: Build and Publish Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Fluxnova Playground Assets
        run: |
          cd fluxnova-playground
          npm ci
          npm run build
          cd ..

      - name: Build Fluxnova Initializer Assets
        run: |
          cd fluxnova-initializer
          npm ci
          npm run build
          cd .. 

      - name: Determine release version
        id: set-vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            # Explicit override via workflow_dispatch input
            releaseVersion="${INPUT_VERSION}"
            echo "Using version from workflow_dispatch input: ${releaseVersion}"
          elif [[ "${GITHUB_REF_NAME}" == release/v* ]]; then
            # Derive major.minor from a release/vX.Y.Z branch name, e.g. release/v3.1.0 -> 3.1
            branchVersion="${GITHUB_REF_NAME#release/v}"
            releaseVersion=$(echo "$branchVersion" | cut -d. -f1,2)
            echo "Derived version from branch '${GITHUB_REF_NAME}': ${releaseVersion}"
          elif [ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]; then
            # Safety net for ad-hoc manual runs without an input: use config.yaml's committed default
            releaseVersion=$(hugo config --format json | jq -r .params.version)
            echo "No input and no release/v* branch match - falling back to config.yaml's committed version: ${releaseVersion}"
          else
            # A push to a release/* branch that is not release/vX.Y.Z must not silently publish config.yaml's version
            echo "::error::Cannot derive the release version from branch '${GITHUB_REF_NAME}'. Use a release/vX.Y.Z branch name."
            exit 1
          fi

          # The version becomes a path, a git tag and part of the baseURL, so fail fast on anything unexpected
          if ! [[ "${releaseVersion}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version '${releaseVersion}'. Expected major.minor, e.g. 3.1."
            exit 1
          fi

          # Set as environment variable
          echo "RELEASE_VERSION=${releaseVersion}" >> $GITHUB_ENV
          
          # Expose as job output
          echo "release_version=${releaseVersion}" >> $GITHUB_OUTPUT
          
          # Set tag name
          TAG="v${releaseVersion}"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build website
        # We override baseURL so Hugo generates correct internal links for the subfolder.
        # HUGO_PARAMS_VERSION overrides config.yaml's committed `version` param for this build,
        # so no manual config.yaml edit is needed before cutting a release.
        env:
          HUGO_PARAMS_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          hugo --minify --baseURL "https://docs.fluxnova.finos.org/manual/${{ env.RELEASE_VERSION }}/" --destination public/manual/${{ env.RELEASE_VERSION }}/

      - name: Fetch versions from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-clone
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate versions.json and "latest" redirect
        id: generate_manifest
        run: |
          PAGES_DIR=./gh-pages-clone
          MANUAL_DIR="$PAGES_DIR/manual"
          
          # Ensure the target directories for our generated files exist in the build output
          mkdir -p ./public/manual
          mkdir -p ./public/manual/latest

          # --- Part 1: Generate versions.json ---
          # List existing version dirs, add the new version, sort unique descending, and format as JSON
          VERSIONS=$( ( (test -d "$MANUAL_DIR" && ls -d "$MANUAL_DIR"/*/ | xargs -n 1 basename) || true; echo "${{ env.RELEASE_VERSION }}" ) \
            | grep -v "latest" \
            | sort -rV | uniq )
            
          echo "Detected versions:"
          echo "$VERSIONS"

          echo "$VERSIONS" | jq -R . | jq -s . > ./public/manual/versions.json
          
          echo "Generated versions.json:"
          cat ./public/manual/versions.json

          # --- Part 2: Create the 'latest' redirect ---
          # The latest version is the first line of our sorted list
          LATEST_VERSION=$(echo "$VERSIONS" | head -n 1)
          
          if [ -z "$LATEST_VERSION" ]; then
            echo "Error: Could not determine the latest version."
            exit 1
          fi

          echo "The latest version is: $LATEST_VERSION"
          echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_OUTPUT
          
          # Sync 404.html for automated redirection to latest version
          cp ./404.html ./public

      - name: Create Release Tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true # Essential: keeps /manual/1.0 when publishing 1.1
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: |
            docs: publish website for ${{ env.RELEASE_VERSION }}
            
            - Update versions.json manifest

      - name: Workflow Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.RELEASE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ env.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Version**: ${{ steps.generate_manifest.outputs.LATEST_VERSION }}" >> $GITHUB_STEP_SUMMARY