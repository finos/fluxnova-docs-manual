---
baseURL: "/"
locale: "en-us"
title: "Fluxnova documentation"
theme: "fluxnova"

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: auto
  tableOfContents:
    startLevel: 1
    endLevel: 3
    ordered: false

blackfriday:
  plainIDAnchors: true

params:
  version: "3.0"
#  versionAlias: "develop"
  forum:
    url: "https://github.com/finos/fluxnova-modeler/discussions"
    name: "Fluxnova Forum"

  # base URLs with optional version number in path using placeholder %s
  # Served directly from finos/fluxnova-bpm-platform's own GitHub Pages (its gh-pages branch),
  # published by that repo's release workflow as openapi/<major.minor>/openapi.json
  # and javadocs/<major.minor>/... . `version` above must match a <major.minor> folder that
  # repo has actually published, otherwise these links 404.
  openApiBaseURL: "https://finos.github.io/fluxnova-bpm-platform/openapi/%s"
  javadocsBaseURL: "https://finos.github.io/fluxnova-bpm-platform/javadocs/%s"
  
  github:
    repositoryName: "finos/fluxnova-docs-manual"
    branch: "main"    

  algolia:
    appId: "PV6E60X9LQ"
    apiKey: "c8ee829e838a908d2aa9b1a6c1f786e3"
    indexName: "fluxnova-finos-docs"

outputs:
  home:
    - "HTML"
    - "RSS"
  section:
    - "HTML"

disableKinds:
- taxonomy
...
